<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --bg: #eef1f6;
        --card: #ffffff;
        --primary: #1d4ed8;
        --primary-dark: #1e40af;
        --primary-soft: #eff6ff;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: var(--bg);
        margin: 0;
        padding: 32px 16px;
        color: var(--ink);
      }
      .card {
        max-width: 660px;
        margin: 0 auto;
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06);
        overflow: hidden;
      }
      .banner {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        padding: 26px 32px;
      }
      .banner .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.75;
        margin: 0 0 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .banner h1 { font-size: 21px; margin: 0 0 6px; }
      .banner p { font-size: 13px; margin: 0; opacity: 0.9; line-height: 1.5; }
      .body { padding: 28px 32px 32px; }

      .section-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--primary);
        margin: 28px 0 12px;
      }
      .section-label:first-child { margin-top: 0; }
      .section-label svg { flex-shrink: 0; }

      label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: #334155; }
      label:first-child { margin-top: 0; }
      input[type=text], input[type=email], input[type=number], input[type=date], select, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        color: var(--ink);
        background: #fff;
        transition: border-color 0.15s;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }
      textarea { resize: vertical; min-height: 50px; }
      .row { display: flex; gap: 12px; }
      .row > div { flex: 1; }
      .files-list { font-size: 12px; color: var(--muted); margin-top: 5px; }
      .files-list-error { color: #b91c1c; font-weight: 600; }

      .trip-section {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 20px;
        background: #fafbfe;
      }

      .item {
        border: 1px solid var(--border);
        border-left: 4px solid #94a3b8;
        border-radius: 12px;
        padding: 18px 20px;
        margin-top: 14px;
        background: #fff;
        transition: border-left-color 0.15s;
      }
      .item[data-type="Transport"]     { border-left-color: #2563eb; }
      .item[data-type="Food"]          { border-left-color: #059669; }
      .item[data-type="Entertainment"] { border-left-color: #7c3aed; }
      .item[data-type="Misc"]          { border-left-color: #64748b; }

      .item-header { display: flex; justify-content: space-between; align-items: center; }
      .item-title { display: flex; align-items: center; gap: 10px; margin: 0; }
      .item-badge {
        width: 22px; height: 22px;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .item-title-text { font-size: 14px; font-weight: 700; color: #334155; }

      .remove-item {
        background: none; border: none; color: #94a3b8; font-size: 12px;
        font-weight: 600; cursor: pointer; padding: 4px 6px; margin: 0; width: auto;
        border-radius: 6px;
      }
      .remove-item:hover { color: #b91c1c; background: #fef2f2; }

      #addItem {
        margin-top: 14px;
        background: #fff;
        color: var(--primary);
        border: 1.5px dashed #93c5fd;
        padding: 11px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background 0.15s;
      }
      #addItem:hover { background: var(--primary-soft); }

      .totals-bar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 26px;
        padding: 14px 18px;
        background: var(--primary-soft);
        border-radius: 10px;
      }
      .totals-bar .label { font-size: 13px; font-weight: 600; color: #334155; }
      .totals-bar .value { font-size: 20px; font-weight: 700; color: var(--primary-dark); }

      button[type=submit] {
        margin-top: 14px;
        width: 100%;
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 13px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      button[type=submit]:hover:not(:disabled) { background: var(--primary-dark); }
      button:disabled { background: #93c5fd; cursor: not-allowed; }

      #result, #error {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 10px;
        font-size: 14px;
        display: none;
        align-items: flex-start;
        gap: 10px;
      }
      #result { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
      #error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
      #result b { display: block; margin-bottom: 4px; font-size: 14px; }
      #result svg, #error svg { flex-shrink: 0; margin-top: 1px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="banner">
        <p class="eyebrow">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M2 16l5-11 5 8 4-6 6 12z"/></svg>
          GGI Finance
        </p>
        <h1>Travel Receipt Log</h1>
        <p>Log every receipt for one trip in a single submission. A trip code is generated automatically and Finance is notified.</p>
      </div>

      <div class="body">
        <form id="tripForm">
          <div class="section-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            Your details
          </div>
          <div class="row">
            <div>
              <label>Full name</label>
              <input type="text" id="employeeName" required>
            </div>
            <div>
              <label>Work email</label>
              <input type="email" id="employeeEmail" required>
            </div>
          </div>

          <div class="section-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 16l5-11 5 8 4-6 6 12z"/></svg>
            Trip details
          </div>
          <div class="trip-section">
            <label>Destination</label>
            <input type="text" id="destination" placeholder="e.g. Jakarta, Indonesia" required>
            <div class="row">
              <div>
                <label>Trip from</label>
                <input type="date" id="startDate" required>
              </div>
              <div>
                <label>Trip to</label>
                <input type="date" id="endDate" required>
              </div>
            </div>
          </div>

          <div class="section-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
            Expenses
          </div>
          <div id="items"></div>
          <button type="button" id="addItem">+ Add another expense</button>

          <div class="totals-bar">
            <span class="label">Trip total (SGD)</span>
            <span class="value" id="tripTotal">0.00</span>
          </div>

          <button type="submit" id="submitBtn">Submit trip receipts</button>
        </form>

        <div id="result">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
          <div id="resultText"></div>
        </div>
        <div id="error">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
          <div id="errorText"></div>
        </div>
      </div>
    </div>

    <template id="itemTemplate">
      <div class="item">
        <div class="item-header">
          <h2 class="item-title"><span class="item-badge">1</span><span class="item-title-text">Expense</span></h2>
          <button type="button" class="remove-item">Remove</button>
        </div>

        <label>Claim type</label>
        <select class="claimType" required>
          <? for (var i = 0; i < claimTypes.length; i++) { ?>
            <option value="<?= claimTypes[i] ?>"><?= claimTypes[i] ?></option>
          <? } ?>
        </select>

        <label>Description</label>
        <textarea class="description" placeholder="e.g. Grab from airport to hotel" required></textarea>

        <label>Amount (SGD)</label>
        <input type="number" class="amount" min="0.01" step="0.01" required>

        <label>Receipt (multiple files allowed &mdash; PDF, JPG, PNG)</label>
        <input type="file" class="receiptFiles" multiple accept=".pdf,.jpg,.jpeg,.png" required>
        <div class="files-list receiptFilesList"></div>

        <label>Credit card statement (optional)</label>
        <input type="file" class="ccFiles" multiple accept=".pdf,.jpg,.jpeg,.png">
        <div class="files-list ccFilesList"></div>
      </div>
    </template>

    <script>
      var itemsEl = document.getElementById('items');
      var itemTemplate = document.getElementById('itemTemplate');
      var MAX_FILE_SIZE_BYTES = <?= maxFileSizeBytes ?>;
      var MAX_FILE_SIZE_MB = Math.round(MAX_FILE_SIZE_BYTES / (1024 * 1024));

      function formatMB(bytes) {
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      }

      // Returns the files in fileList that exceed the size limit, so an
      // oversized file can be rejected instantly in the browser rather
      // than attempted: a file this large can take a long time to
      // upload only to be killed by the network layer partway through,
      // which shows up as a generic network error rather than a clear
      // "file too large" message.
      function oversizedFiles(fileList) {
        return Array.prototype.filter.call(fileList, function (f) {
          return f.size > MAX_FILE_SIZE_BYTES;
        });
      }

      function updateFilesList(fileList, listEl) {
        if (!fileList.length) {
          listEl.textContent = '';
          listEl.classList.remove('files-list-error');
          return;
        }
        var oversized = oversizedFiles(fileList);
        if (oversized.length) {
          listEl.textContent = oversized.map(function (f) {
            return f.name + ' (' + formatMB(f.size) + ')';
          }).join(', ') + ' exceeds the ' + MAX_FILE_SIZE_MB + ' MB limit - please use a smaller file.';
          listEl.classList.add('files-list-error');
        } else {
          var names = Array.prototype.map.call(fileList, function (f) { return f.name; });
          listEl.textContent = 'Attached: ' + names.join(', ');
          listEl.classList.remove('files-list-error');
        }
      }

      function renumberItems() {
        itemsEl.querySelectorAll('.item').forEach(function (el, i) {
          el.querySelector('.item-badge').textContent = i + 1;
        });
      }

      function updateTotal() {
        var total = 0;
        itemsEl.querySelectorAll('.amount').forEach(function (input) {
          var v = parseFloat(input.value);
          if (!isNaN(v)) total += v;
        });
        document.getElementById('tripTotal').textContent = total.toFixed(2);
      }

      function addItem() {
        var node = itemTemplate.content.cloneNode(true);
        var itemEl = node.querySelector('.item');
        var claimTypeSelect = itemEl.querySelector('.claimType');

        itemEl.dataset.type = claimTypeSelect.value;
        claimTypeSelect.addEventListener('change', function () {
          itemEl.dataset.type = claimTypeSelect.value;
        });

        itemEl.querySelector('.amount').addEventListener('input', updateTotal);

        itemEl.querySelector('.remove-item').addEventListener('click', function () {
          if (itemsEl.querySelectorAll('.item').length > 1) {
            itemEl.remove();
            renumberItems();
            updateTotal();
          }
        });

        itemEl.querySelector('.receiptFiles').addEventListener('change', function (e) {
          updateFilesList(e.target.files, itemEl.querySelector('.receiptFilesList'));
        });
        itemEl.querySelector('.ccFiles').addEventListener('change', function (e) {
          updateFilesList(e.target.files, itemEl.querySelector('.ccFilesList'));
        });

        itemsEl.appendChild(itemEl);
        renumberItems();
      }

      document.getElementById('addItem').addEventListener('click', addItem);
      addItem();

      function fileToBase64(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            var result = reader.result;
            resolve(result.substring(result.indexOf(',') + 1));
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function delay(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      // Wraps google.script.run in a Promise so each server call can be
      // awaited one at a time, and automatically retries a call that
      // fails with a plain network error (a "NetworkError... HTTP 400"
      // with no app-level message is the browser failing to complete
      // the request at all, e.g. a flaky connection - not an error from
      // the script itself, which would carry a real message). A quiet
      // retry after a short backoff handles that transient case instead
      // of aborting the whole trip on the first blip.
      function callServer(fnName, args, attempt) {
        attempt = attempt || 1;
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            [fnName].apply(null, args);
        }).catch(function (err) {
          var message = (err && err.message) || String(err);
          var looksLikeNetworkBlip = /network/i.test(message) && !/^(Item|Missing|Add at least|No more than|Both a start|Trip start|A valid|Full|Employee|Description|Amount|File)/.test(message);
          if (looksLikeNetworkBlip && attempt < 4) {
            return delay(attempt * 1000).then(function () {
              return callServer(fnName, args, attempt + 1);
            });
          }
          throw message;
        });
      }

      document.getElementById('tripForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var errorEl = document.getElementById('error');
        var resultEl = document.getElementById('result');
        var submitBtn = document.getElementById('submitBtn');
        errorEl.style.display = 'none';
        resultEl.style.display = 'none';

        var itemEls = Array.prototype.slice.call(itemsEl.querySelectorAll('.item'));
        for (var i = 0; i < itemEls.length; i++) {
          var receiptFilesI = itemEls[i].querySelector('.receiptFiles').files;
          var ccFilesI = itemEls[i].querySelector('.ccFiles').files;
          if (!receiptFilesI.length) {
            document.getElementById('errorText').textContent = 'Expense ' + (i + 1) + ': please attach at least one receipt.';
            errorEl.style.display = 'flex';
            return;
          }
          var oversized = oversizedFiles(receiptFilesI).concat(oversizedFiles(ccFilesI));
          if (oversized.length) {
            document.getElementById('errorText').textContent = 'Expense ' + (i + 1) + ': "' + oversized[0].name +
              '" (' + formatMB(oversized[0].size) + ') exceeds the ' + MAX_FILE_SIZE_MB + ' MB limit. Please use a smaller file.';
            errorEl.style.display = 'flex';
            return;
          }
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        var header = {
          employeeName: document.getElementById('employeeName').value,
          employeeEmail: document.getElementById('employeeEmail').value,
          destination: document.getElementById('destination').value,
          startDate: document.getElementById('startDate').value,
          endDate: document.getElementById('endDate').value,
          itemCount: itemEls.length
        };

        function fail(message) {
          document.getElementById('errorText').textContent = message;
          errorEl.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit trip receipts';
        }

        // Uploads one file at a time (never bundling multiple files into
        // a single request) so a large photo/statement can't push a
        // request past a size a network intermediary will reject.
        function uploadOneByOne(itemFolderId, files, isCC, index, progressPrefix) {
          var names = [];
          var folderUrl = '';
          var chain = Promise.resolve();
          Array.prototype.forEach.call(files, function (file, fi) {
            chain = chain.then(function () {
              submitBtn.textContent = progressPrefix + ' (file ' + (fi + 1) + ' of ' + files.length + ')...';
              return fileToBase64(file).then(function (base64) {
                return callServer('uploadItemFile', [{
                  itemFolderId: itemFolderId,
                  isCC: isCC,
                  index: index,
                  file: { name: file.name, mimeType: file.type || 'application/octet-stream', base64: base64 }
                }]);
              }).then(function (res) {
                names.push(res.name);
                folderUrl = res.folderUrl;
              });
            });
          });
          return chain.then(function () { return { names: names, folderUrl: folderUrl }; });
        }

        callServer('startTrip', [header]).then(function (start) {
          var total = 0;
          var itemsDone = 0;
          var chain = Promise.resolve();

          itemEls.forEach(function (itemEl, index) {
            chain = chain.then(function () {
              var claimType = itemEl.querySelector('.claimType').value;
              var description = itemEl.querySelector('.description').value;
              var amount = itemEl.querySelector('.amount').value;
              var receiptFiles = itemEl.querySelector('.receiptFiles').files;
              var ccFiles = itemEl.querySelector('.ccFiles').files;

              return callServer('startItem', [{
                tripFolderId: start.tripFolderId,
                index: index,
                claimType: claimType
              }]).then(function (itemStart) {
                return uploadOneByOne(
                  itemStart.itemFolderId, receiptFiles, false, index,
                  'Uploading item ' + (index + 1) + ' of ' + itemEls.length + ' - receipt'
                ).then(function (receiptRes) {
                  return uploadOneByOne(
                    itemStart.itemFolderId, ccFiles, true, index,
                    'Uploading item ' + (index + 1) + ' of ' + itemEls.length + ' - card statement'
                  ).then(function (ccRes) {
                    return callServer('finishItem', [{
                      tripCode: start.tripCode,
                      header: header,
                      index: index,
                      claimType: claimType,
                      description: description,
                      amount: amount,
                      itemFolderUrl: itemStart.itemFolderUrl,
                      receiptNames: receiptRes.names,
                      ccFolderUrl: ccRes.folderUrl,
                      ccNames: ccRes.names
                    }]);
                  });
                });
              }).then(function (res) {
                total += res.amount;
                itemsDone += 1;
              }).catch(function (err) {
                throw (itemsDone === 0 ? '' : 'Items 1-' + itemsDone + ' were already saved under trip ' + start.tripCode + '. ') +
                  'Item ' + (index + 1) + ' failed: ' + err;
              });
            });
          });

          return chain.then(function () {
            return callServer('finalizeTrip', [start.tripCode, header, itemEls.length, total, start.tripFolderUrl]);
          });
        }).then(function (res) {
          document.getElementById('resultText').innerHTML = '<b>Trip submitted &mdash; ' + res.tripCode + '</b>' +
            res.itemCount + ' item(s), total SGD ' + res.total.toFixed(2) + '.<br>' +
            'Receipts saved to <a href="' + res.folderUrl + '" target="_blank">Drive folder</a>.';
          resultEl.style.display = 'flex';
          document.getElementById('tripForm').reset();
          itemsEl.innerHTML = '';
          addItem();
          updateTotal();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit trip receipts';
        }).catch(fail);
      });
    </script>
  </body>
</html>
