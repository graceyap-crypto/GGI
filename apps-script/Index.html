<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 24px;
        color: #1f2937;
      }
      .card {
        max-width: 560px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        padding: 28px 32px;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: #6b7280; font-size: 13px; margin: 0 0 24px; }
      label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
      input[type=text], input[type=email], input[type=number], select, textarea {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
      }
      textarea { resize: vertical; min-height: 64px; }
      .row { display: flex; gap: 12px; }
      .row > div { flex: 1; }
      .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
      .files-list { font-size: 12px; color: #374151; margin-top: 6px; }
      button {
        margin-top: 24px;
        width: 100%;
        background: #2563eb;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { background: #93c5fd; cursor: not-allowed; }
      #result, #error {
        margin-top: 20px;
        padding: 14px 16px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
      }
      #result { background: #ecfdf5; border: 1px solid #a7f3d0; }
      #error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
      #result b { display: block; margin-bottom: 4px; }
      .logo {
        display: block;
        max-height: 64px;
        max-width: 180px;
        object-fit: contain;
        margin: 0 0 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <? if (logoDataUri) { ?>
        <img class="logo" src="<?= logoDataUri ?>" alt="GGI logo">
      <? } ?>
      <h1>GGI Team Expense Claim</h1>
      <p class="sub">Fill in your details, attach receipts, and submit. A claim code is generated automatically and Finance is notified.</p>

      <form id="claimForm">
        <label>Full name</label>
        <input type="text" id="employeeName" required>

        <label>Work email</label>
        <input type="email" id="employeeEmail" required>

        <div class="row">
          <div>
            <label>Country</label>
            <select id="country" required>
              <option value="" disabled selected>Select country</option>
              <? for (var i = 0; i < countries.length; i++) { ?>
                <option value="<?= countries[i] ?>"><?= countries[i] ?></option>
              <? } ?>
            </select>
          </div>
          <div>
            <label>Local currency</label>
            <input type="text" id="localCurrency" readonly>
          </div>
        </div>

        <label>Amount (local currency)</label>
        <input type="number" id="amount" min="0.01" step="0.01" required>
        <div class="hint" id="sgdHint">SGD equivalent is calculated by Finance's official rate after submission.</div>

        <label>Purpose / description</label>
        <textarea id="description" placeholder="e.g. Taxi fare to client site on 12 Aug" required></textarea>

        <label>Receipts (multiple files allowed &mdash; PDF, JPG, PNG)</label>
        <input type="file" id="files" multiple accept=".pdf,.jpg,.jpeg,.png" required>
        <div class="files-list" id="filesList"></div>

        <button type="submit" id="submitBtn">Submit claim</button>
      </form>

      <div id="result"></div>
      <div id="error"></div>
    </div>

    <script>
      var CURRENCY_MAP = <?!= JSON.stringify(currencyMap) ?>;

      document.getElementById('country').addEventListener('change', function (e) {
        document.getElementById('localCurrency').value = CURRENCY_MAP[e.target.value] || '';
      });

      document.getElementById('files').addEventListener('change', function (e) {
        var names = Array.prototype.map.call(e.target.files, function (f) { return f.name; });
        document.getElementById('filesList').textContent = names.length ? ('Attached: ' + names.join(', ')) : '';
      });

      function fileToBase64(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            var result = reader.result;
            resolve(result.substring(result.indexOf(',') + 1));
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      document.getElementById('claimForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var errorEl = document.getElementById('error');
        var resultEl = document.getElementById('result');
        var submitBtn = document.getElementById('submitBtn');
        errorEl.style.display = 'none';
        resultEl.style.display = 'none';

        var fileInput = document.getElementById('files');
        if (!fileInput.files.length) {
          errorEl.textContent = 'Please attach at least one receipt.';
          errorEl.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        Promise.all(Array.prototype.map.call(fileInput.files, function (file) {
          return fileToBase64(file).then(function (base64) {
            return { name: file.name, mimeType: file.type || 'application/octet-stream', base64: base64 };
          });
        })).then(function (files) {
          var form = {
            employeeName: document.getElementById('employeeName').value,
            employeeEmail: document.getElementById('employeeEmail').value,
            country: document.getElementById('country').value,
            localCurrency: document.getElementById('localCurrency').value,
            amount: document.getElementById('amount').value,
            description: document.getElementById('description').value,
            files: files
          };

          google.script.run
            .withSuccessHandler(function (res) {
              resultEl.innerHTML = '<b>Claim submitted &mdash; ' + res.claimCode + '</b>' +
                'Amount: SGD ' + res.sgdAmount.toFixed(2) + ' (rate ' + res.fxRate + ')<br>' +
                'Receipts saved to <a href="' + res.folderUrl + '" target="_blank">Drive folder</a>.';
              resultEl.style.display = 'block';
              document.getElementById('claimForm').reset();
              document.getElementById('filesList').textContent = '';
              submitBtn.disabled = false;
              submitBtn.textContent = 'Submit claim';
            })
            .withFailureHandler(function (err) {
              errorEl.textContent = err.message || String(err);
              errorEl.style.display = 'block';
              submitBtn.disabled = false;
              submitBtn.textContent = 'Submit claim';
            })
            .submitClaim(form);
        });
      });
    </script>
  </body>
</html>
